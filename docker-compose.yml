
services:
  db:
    image: postgres:15-alpine
    container_name: foodcost_db
    restart: unless-stopped
    env_file:
      - ./.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - foodcost_network

  redis:
    image: redis:7-alpine
    container_name: foodcost_redis
    restart: unless-stopped
    env_file:
      - ./.env.docker
    command:
      [
        "sh",
        "-c",
        "redis-server --appendonly yes --requirepass \"${REDIS_PASSWORD}\" --port 6379"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodcost_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodcost_api
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - foodcost_network
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

networks:
  foodcost_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: